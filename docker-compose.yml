name: scamshield

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://scamshield:scamshield@db:5432/scamshield
  SCAMSHIELD_BRANDS: /data/brands.json
  SCAMSHIELD_THEMES: /data/scam_themes.json
  SCAMSHIELD_FEEDS: /data/datasets/raw
  SCAMSHIELD_CACHE: /data/cache
  SCAMSHIELD_ARTIFACTS: /artifacts

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scamshield
      POSTGRES_PASSWORD: scamshield
      POSTGRES_DB: scamshield
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamshield"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/app/app
      - ./data:/data:ro
      - ./backend/artifacts:/artifacts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      retries: 20

  # Fetches pages: user scans first, then radar finds. Scale with --scale worker=3.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      SCAMSHIELD_WORKER_JOBS: scan,fetch,feeds
      SCAMSHIELD_WORKER_SCHEDULE: "0"
    volumes:
      - ./backend/app:/app/app
      - ./data:/data  # writable: hourly phishing-feed refresh
      - ./backend/artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy

  # Runs the discovery sources on their schedule (slow: crt.sh, DNS sweeps, daily lists).
  radar:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
      SCAMSHIELD_WORKER_JOBS: radar
      SCAMSHIELD_WORKER_SCHEDULE: "1"
    volumes:
      - ./backend/app:/app/app
      - ./data:/data  # writable: radar caches
      - ./backend/artifacts:/artifacts
    depends_on:
      api:
        condition: service_healthy

  # Samri's demo scam pages under lookalike names, for the live demo only (never put online).
  # Start with `docker compose --profile demo up` and set SCAMSHIELD_DEMO_HOSTS in .env
  # (see demo-pages/README.md). The worker reaches them through these network aliases.
  demo:
    profiles: ["demo"]
    image: python:3.11-slim
    command: python -m http.server 8080 --directory /site
    volumes:
      - ./demo-pages:/site:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
        aliases:
          - tamm-fines-pay.ae
          - emiratesnbd-verify.com
          - gulfdriverguide.ae

volumes:
  pgdata:
