<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ScamShield</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 380px; padding: 14px; }
    #lang { min-height: 30px; padding: 4px 12px; font-size: 12px; }
    .site { margin: 12px 0 10px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px;
            background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; word-break: break-all; }
    .site svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
    .hero { padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .hero.FRAUD-bg { border-color: var(--fraud-line); box-shadow: 0 0 0 1px var(--fraud-line), 0 0 30px -12px rgba(255, 122, 122, .6); }
    .hero.SUSPICIOUS-bg { border-color: var(--review-line); }
    .hero.LEGIT-bg { border-color: var(--safe-line); }
    h1 { font-size: 18px; line-height: 1.3; margin: 8px 0 0; letter-spacing: -0.01em; }
    .ring { width: 64px; height: 64px; position: relative; }
    .ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 20px; }
    .ring small { position: absolute; bottom: -16px; inset-inline: 0; text-align: center; font-size: 10px; color: var(--muted); }
    section.block { margin-top: 10px; padding: 12px 14px; }
    section.block strong { display: block; font-size: 12px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
    .reasons { list-style: none; padding: 0; margin: 0; }
    .reasons li { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: baseline; padding: 4px 0; }
    .w { font-weight: 800; font-size: 12px; color: var(--fraud); direction: ltr; text-align: center; }
    .todo { margin: 0; padding: 0; list-style: none; counter-reset: s; }
    .todo li { counter-increment: s; display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 3px 0; }
    .todo li::before { content: counter(s); width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center;
                       background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: 11px; }
    .state { padding: 22px 16px; text-align: center; color: var(--muted); }
    .scan { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 999px; border: 2px solid var(--line-2);
            border-top-color: var(--primary); animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    footer .grow { flex: 1; }
    .settings { margin-top: 10px; display: block; text-align: center; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="">
    <span class="name">ScamShield <small>Guardian</small></span>
    <button id="lang" type="button">العربية</button>
  </header>
  <p class="site ltr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg><span id="site"></span></p>
  <div id="result" aria-live="polite"><div class="panel state"><div class="scan"></div><span id="status">Checking…</span></div></div>
  <footer>
    <button id="recheck" type="button" class="primary grow">Check again</button>
    <a class="button grow" id="report" href="https://www.adpolice.gov.ae/" target="_blank" rel="noreferrer">Report: Aman 8002626</a>
  </footer>
  <a class="settings" href="options.html" target="_blank">Settings</a>
  <script src="popup.js"></script>
</body>
</html>
