<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ScamShield Guardian</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 340px; padding: 16px 16px 14px; }
    header { position: relative; }
    #menu-btn { width: 32px; height: 32px; min-height: 32px; padding: 0; border: 0; border-radius: 999px; background: transparent; color: var(--ink-2); }
    #menu-btn:hover { background: var(--surface-2); }
    #menu-btn svg { width: 18px; height: 18px; }
    .menu { position: absolute; top: 36px; inset-inline-end: 0; z-index: 5; min-width: 196px; padding: 6px; background: var(--surface);
            border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px -12px rgba(23, 21, 28, 0.35); }
    .menu button, .menu a { width: 100%; justify-content: flex-start; border: 0; border-radius: 8px; min-height: 34px;
                            padding: 6px 10px; font-weight: 600; font-size: 13px; background: transparent; color: var(--ink); }
    .menu button:hover, .menu a:hover { background: var(--primary-soft); }

    .banner { margin: 14px 0 12px; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
              font-size: 20px; font-weight: 800; letter-spacing: -0.01em; animation: rise 0.25s ease-out; }
    .banner svg { width: 28px; height: 28px; flex: none; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

    .rows { display: grid; gap: 10px; padding: 0 2px; }
    .row { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; color: var(--ink); font-size: 15px; }
    .row > svg { width: 20px; height: 20px; color: var(--primary); margin-top: 2px; }
    .row b { font-weight: 800; word-break: break-all; }
    .row .sub { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
    .score.FRAUD, .score.SUSPICIOUS, .score.LEGIT, .score.UNKNOWN { background: none; }

    details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
    summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--ink-2); list-style: none; display: flex; justify-content: space-between; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; font-weight: 800; color: var(--muted); }
    details[open] summary::after { content: "–"; }
    .reasons { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
    .reasons li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: baseline; }
    .w { font-weight: 800; font-size: 12px; color: var(--fraud); direction: ltr; text-align: center;
         background: var(--fraud-soft); border-radius: 6px; padding: 0 4px; }
    .w.neg { color: var(--safe); background: var(--safe-soft); }

    .state { padding: 26px 8px 18px; text-align: center; color: var(--muted); }
    .scan { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 999px; position: relative; border: 2px solid var(--line);
            background: conic-gradient(from 0deg, rgba(69, 36, 181, 0.35), transparent 30%); animation: spin 1.2s linear infinite; }
    .scan::after { content: ""; position: absolute; inset: 22px; border-radius: 999px; background: var(--primary); }
    @keyframes spin { to { transform: rotate(360deg); } }

    #details { width: 100%; margin-top: 14px; min-height: 42px; font-size: 15px; border-radius: 12px; }
    #details svg { width: 18px; height: 18px; }
    [dir="rtl"] #details svg { transform: scaleX(-1); }
    .foot { margin-top: 10px; text-align: center; font-size: 12px; color: var(--muted); }
    .foot a { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="">
    <span class="name">ScamShield Guardian</span>
    <button id="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" id="lang" role="menuitem">العربية</button>
      <button type="button" id="recheck" role="menuitem">Check again</button>
      <a id="report" role="menuitem" href="https://www.adpolice.gov.ae/" target="_blank" rel="noreferrer">Report a scam: Aman 8002626</a>
      <a id="settings" role="menuitem" href="options.html" target="_blank">Settings</a>
    </div>
  </header>
  <div id="result" aria-live="polite"><div class="state"><div class="scan"></div><span>Checking…</span></div></div>
  <button id="details" type="button" class="primary" hidden></button>
  <p class="foot" id="foot"></p>
  <script src="popup.js"></script>
</body>
</html>
