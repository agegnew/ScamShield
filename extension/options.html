<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ScamShield Guardian settings</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { max-width: 560px; margin: 40px auto; padding: 28px; border: 1px solid var(--line); border-radius: 18px; }
    label { display: block; font-weight: 700; margin: 18px 0 6px; }
    input { width: 100%; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; }
    .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  </style>
</head>
<body>
  <header><img src="icons/icon-32.png" alt=""><span class="name">ScamShield Guardian</span></header>
  <label for="api">ScamShield server</label>
  <input id="api" type="url" placeholder="https://scamshield.42studio.fit">
  <p class="muted">The extension sends this server only the address of the site you visit (never page content or anything you type).</p>
  <label for="site">ScamShield website (for "View details")</label>
  <input id="site" type="url" placeholder="https://scamshield.42studio.fit">
  <div class="row">
    <button class="primary" id="save" type="button">Save and sync</button>
    <span id="status" class="muted" aria-live="polite"></span>
  </div>
  <p class="muted" id="sync"></p>
  <script src="options.js"></script>
</body>
</html>
